<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#1246B8"/>
    </linearGradient>
    <linearGradient id="folderBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE8FF"/>
    </linearGradient>
    <linearGradient id="folderTab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#C9DBFF"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD764"/>
      <stop offset="1" stop-color="#FFA722"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="-6" stdDeviation="6" flood-color="#FFF" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Background squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  <!-- subtle top highlight -->
  <g clip-path="url(#squircle)">
    <ellipse cx="512" cy="60" rx="620" ry="300" fill="#FFFFFF" opacity="0.10"/>
  </g>

  <!-- Left folder (source) -->
  <g filter="url(#shadow)">
    <path d="M190 360 h150 l40 44 h150 a28 28 0 0 1 28 28 v240 a28 28 0 0 1 -28 28 h-340 a28 28 0 0 1 -28 -28 v-284 a28 28 0 0 1 28 -28 z" fill="url(#folderTab)"/>
    <rect x="162" y="450" width="396" height="250" rx="28" fill="url(#folderBody)"/>
  </g>

  <!-- Right folder (destination) -->
  <g filter="url(#shadow)">
    <path d="M466 460 h150 l40 44 h150 a28 28 0 0 1 28 28 v240 a28 28 0 0 1 -28 28 h-340 a28 28 0 0 1 -28 -28 v-284 a28 28 0 0 1 28 -28 z" fill="url(#folderTab)"/>
    <rect x="438" y="550" width="396" height="250" rx="28" fill="url(#folderBody)"/>
  </g>

  <!-- Sync arrows badge -->
  <g transform="translate(512 512)" filter="url(#shadow)">
    <circle r="138" fill="#0B2E7A"/>
    <circle r="138" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="10"/>
    <!-- top arc, clockwise -->
    <path d="M -86 -22 A 92 92 0 0 1 62 -66" fill="none" stroke="url(#arrow)" stroke-width="30" stroke-linecap="round"/>
    <path d="M 96 -80 L 44 -36 L 100 -22 Z" fill="url(#arrow)" stroke="url(#arrow)" stroke-width="6" stroke-linejoin="round"/>
    <!-- bottom arc -->
    <path d="M 86 22 A 92 92 0 0 1 -62 66" fill="none" stroke="url(#arrow)" stroke-width="30" stroke-linecap="round"/>
    <path d="M -96 80 L -44 36 L -100 22 Z" fill="url(#arrow)" stroke="url(#arrow)" stroke-width="6" stroke-linejoin="round"/>
  </g>
</svg>
